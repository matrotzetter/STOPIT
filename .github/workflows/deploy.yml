# Mise en ligne automatique sur GitHub Pages.
# À chaque envoi (« push ») sur la branche main, GitHub teste l'app,
# fabrique la version finale et la publie.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de lancer la mise en ligne à la main depuis GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
